model:
  hf_id: jhu-clsp/ettin-encoder-17m
  sae_width: 30522
  k: 32
  aux_k: 64
  dead_steps_threshold: 10000000
  normalize_input: true
sae:
  corpus_dataset: Tevatron/msmarco-passage-corpus
  corpus_text_field: text
  doc_max_length: 128
  batch_size: 16
  lr: 5.0e-05
