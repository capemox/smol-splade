[project]
name = "sae-smol-splade"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.37.0",
    "datasets>=2.14.0",
    "huggingface-hub",
    "tqdm",
    "tensorboard",
    "pyyaml",
    "numpy",
    "peft>=0.19.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
