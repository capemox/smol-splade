# Shallow/pruned query-encoder experiments.
#
# The query encoder is built by taking selected layers from the frozen document
# encoder, then training that smaller query side to match the full document
# encoder's sparse output space.
#
# Layer selection:
# - Set n_layers to keep the first N layers.
# - Or set layer_indices to choose exact zero-based layers. This covers first-N,
#   last-N, spaced, and hand-picked layer selections. Negative indices are
#   supported for Lion; use explicit positive indices for SPLADE.
#
# Factorization:
# - Set factorize_embeddings: true to replace the tied lexical embedding/head
#   matrix with a low-rank factorized version.

splade_shallow:
  doc_splade_hf_id: "naver/splade-v3"

  # First-N example:
  n_layers: 3
  # Spaced example for a 12-layer SPLADE model:
  # layer_indices: [0, 6, 11]

  factorize_embeddings: false
  factorized_embedding_dim: 256
  factorization_init: "svd"

  doc_max_length: 128
  query_max_length: 32
  batch_size: 16
  gradient_accumulation_steps: 2
  eval_batch_size: 32

  freeze_warmup_steps: 5_000
  head_lr_scale: 0.1
  freeze_head_after_warmup: false

  alignment_steps: 50_000
  alignment_lr: 2.0e-4
  weight_decay: 0.01
  fp16: true

  nway: 8
  use_contrastive: false
  log_ranking_metrics: false
  contrastive_coeff: 0.1
  contrastive_temperature: 1.0
  lambda_q: 0.0002
  lambda_q_warmup_steps: 5_000

  log_every: 200
  save_every: 10_000
  output_dir: "splade_shallow"


lion_shallow:
  lion_hf_id: "hzeng/Lion-SP-1B-llama3-marco-mntp"

  # First-N example:
  n_layers: 3
  # Spaced example:
  # layer_indices: [0, 3, 6, 10, -1]

  factorize_embeddings: false
  factorized_embedding_dim: 1024
  factorization_init: "svd"

  doc_max_length: 128
  query_max_length: 32
  batch_size: 4
  gradient_accumulation_steps: 8
  eval_batch_size: 4

  freeze_warmup_steps: 5_000
  head_lr_scale: 0.1
  freeze_head_after_warmup: true

  alignment_steps: 50_000
  alignment_lr: 2.0e-4
  align_loss_kind: "mse"
  weight_decay: 0.01
  fp16: true

  nway: 8
  contrastive_coeff: 0.0
  contrastive_temperature: 1.0
  lambda_q: 0.001
  lambda_q_warmup_steps: 5_000

  log_every: 200
  save_every: 10_000
  output_dir: "lion_shallow"


splade_static:
  doc_splade_hf_id: "naver/splade-v3"

  doc_max_length: 128
  query_max_length: 32
  batch_size: 32
  eval_batch_size: 64
  nway: 8

  alignment_steps: 10_000
  alignment_lr: 1.0e-3
  weight_decay: 0.0
  fp16: true
  lambda_q: 0.0

  log_every: 200
  save_every: 1_000
  output_dir: "splade_static"


lion_static:
  lion_hf_id: "hzeng/Lion-SP-1B-llama3-marco-mntp"

  doc_max_length: 128
  query_max_length: 32
  batch_size: 32
  eval_batch_size: 32
  nway: 8

  alignment_steps: 10_000
  alignment_lr: 1.0e-3
  weight_decay: 0.0
  fp16: true
  lambda_q: 0.0

  log_every: 200
  save_every: 1_000
  output_dir: "lion_static"


eval:
  datasets:
    - "zeta-alpha-ai/NanoMSMARCO"
    - "zeta-alpha-ai/NanoNFCorpus"
  batch_size: 32
